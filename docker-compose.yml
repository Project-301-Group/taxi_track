version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taxi_track
      MYSQL_USER: taxi_user
      MYSQL_PASSWORD: taxi_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=mysql+pymysql://taxi_user:taxi_password@mysql:3306/taxi_track
      - SECRET_KEY=your-secret-key-here
      - FLASK_ENV=production
    depends_on:
      - mysql
    volumes:
      - .:/app
    command: >
      sh -c "sleep 10 && 
             python database_setup.py && 
             python app.py"

volumes:
  mysql_data:


